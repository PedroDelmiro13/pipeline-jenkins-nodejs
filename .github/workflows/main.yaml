name: "Minha pipeline"

on:
  push: 
    branches: [main, developer]
jobs:
  meu-job:
    runs-on: "ubuntu-latest"

    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v7

      - name: Install Dependecies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: SAST - Semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/security-audit --config p/owasp-top-ten --error

      - name: Start app
        run: |
          npm start &
          sleep 10  

      - name: DAST - OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          fail_action: true